# Netlify build configuration for Cavendish Cards.
#
# On each deploy, Netlify runs the generator (which reads the card files and
# writes web/cards.json and web/faces/), then publishes the web/ folder.
# The generator is pure Python standard library; Netlify's build image
# already includes python3.

[build]
  command = "python3 scripts/build-site.py"
  publish = "web"

# Response headers: security hardening for every response, plus long-lived
# immutable caching for the self-hosted fonts. The CSP can be strict because
# the site loads only same-origin resources (no third-party scripts, styles,
# fonts, or images) -- with one exception. img-src allows data: URLs, because
# badges.html lets someone put THEIR OWN logo on a badge: that file is read with
# FileReader in their browser and embedded in the badge SVG as a data URL. It is
# never uploaded, and there is no endpoint to upload it to. A data: image cannot
# execute anything -- an SVG inside an <image> element renders in the secure
# static mode -- and this is the narrowest relaxation that makes the feature
# work. Note what is NOT relaxed: style-src still has no 'unsafe-inline', so no
# page here may use a style attribute. Badge colors are classes, the badge
# sheets use SVG presentation attributes, and the print @page rule goes in
# through the CSSOM, which CSP does not govern.
# frame-ancestors allows embedding from Stimpunks only;
# widen or tighten as needed. The script-src sha256 whitelists the small inline
# no-flash theme script; keep it in sync with _THEME_INLINE in build-site.py and
# the copy in web/index.html (change the script -> recompute the hash).
[[headers]]
  for = "/*"
  [headers.values]
    # RFC 6797. includeSubDomains is safe here and was checked before it went
    # in: www is the only subdomain, it serves valid HTTPS, the Netlify cert is
    # a wildcard (*.cavendish.space), and DNS is Netlify's, so a new subdomain
    # gets HTTPS provisioned with it. The commitment: once this ships, any
    # subdomain that is not HTTPS is unreachable for anyone who has visited the
    # apex, for max-age. No `preload` -- the preload list's own operator now
    # advises against it, and removal from it takes months.
    #
    # max-age is two years (the spec's production value), raised from one on
    # 2026-09-17. It is a per-visitor sliding timer: each response resets that
    # browser's countdown, so this protects anyone returning within 730 days of
    # their last visit rather than committing the site for two years. Going 1 ->
    # 2 years does not change the kind of failure, only its duration -- HSTS at
    # any max-age already makes certificate errors non-bypassable (RFC 6797
    # 12.1), which is the step that was taken when HSTS went on.
    #
    # Rollback is the asymmetric part: max-age=0 is only learned from a
    # SUCCESSFUL HTTPS response, so the escape hatch needs the thing that would
    # be broken. The realistic break is a failed renewal, which is what a
    # mis-set CAA record would cause -- verify those when you add them.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Link = "</llms.txt>; rel=\"describedby\"; type=\"text/markdown\""
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self' https://stimpunks.org https://*.stimpunks.org; form-action 'none'; img-src 'self' data:; style-src 'self'; script-src 'self' 'sha256-7/896sRDDRYbHkuzCgrxnPtpdmQDYaNNIUKwJwO8+Gc='; font-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; worker-src 'self'"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify does not map the .webmanifest extension, so it falls back to
# application/octet-stream. Some browsers refuse a manifest served at the wrong
# type, which silently breaks install-to-home-screen. Pin the registered type.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Per-page Markdown source endpoints. Without an explicit type Netlify serves
# .md as application/octet-stream, which makes browsers download the file and
# agents misclassify it.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# RFC 9116 requires security.txt be served as text/plain.
[[headers]]
  for = "/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
