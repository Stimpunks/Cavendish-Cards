<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<defs><clipPath id="art-window"><rect x="60" y="150" width="630" height="600" rx="24"/></clipPath></defs>
<rect x="0" y="0" width="750" height="1050" rx="48" fill="#eee8d5"/>
<rect x="60" y="60" width="34" height="34" rx="9" fill="#993C1D"/>
<text x="108" y="87" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="30" font-weight="500" fill="#4A1B0C">love locution</text>
<!-- The clip lives on an untransformed group: a clip-path resolves in the
     element's own user space, so putting both on one <g> would clip against
     the moved coordinates and shear the top off every picture. -->
<rect id="art" x="60" y="150" width="630" height="600" rx="24" fill="#fdf6e3"/>
<g id="art-illustration" clip-path="url(#art-window)"><g transform="translate(60 185)"><g stroke-linecap="round" stroke-linejoin="round"><circle cx="315.0" cy="282.0" r="150.0" fill="#993C1D" fill-opacity="0.5"/><circle cx="315.0" cy="282.0" r="150.0" fill="none" stroke="#4A1B0C" stroke-width="11"/><circle cx="315.0" cy="282.0" r="92.0" fill="none" stroke="#fdf6e3" stroke-width="6"/><g transform="translate(96 470) rotate(-74)"><rect x="-13.0" y="-84.0" width="26.0" height="118.0" rx="13.0" fill="#4A1B0C" fill-opacity="0.28"/><circle cx="0.0" cy="-96.0" r="28.0" fill="#4A1B0C" fill-opacity="0.28"/><circle cx="0.0" cy="-96.0" r="13.0" fill="#fdf6e3"/></g><line x1="60.0" y1="486.0" x2="240.0" y2="486.0" stroke-opacity="0.4" fill="none" stroke="#993C1D" stroke-width="5"/></g></g></g>
<rect x="60" y="150" width="630" height="600" rx="24" fill="none" stroke="#993C1D" stroke-width="3"/>
<text x="60" y="852" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="58" font-weight="700" fill="#002b36">nothing to fix</text>
