<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<defs><clipPath id="art-window"><rect x="60" y="150" width="630" height="600" rx="24"/></clipPath></defs>
<rect x="0" y="0" width="750" height="1050" rx="48" fill="#eee8d5"/>
<rect x="60" y="60" width="34" height="34" rx="9" fill="#0F6E56"/>
<text x="108" y="87" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="30" font-weight="500" fill="#04342C">what helps</text>
<!-- The clip lives on an untransformed group: a clip-path resolves in the
     element's own user space, so putting both on one <g> would clip against
     the moved coordinates and shear the top off every picture. -->
<rect id="art" x="60" y="150" width="630" height="600" rx="24" fill="#fdf6e3"/>
<g id="art-illustration" clip-path="url(#art-window)"><g transform="translate(60 185)"><g stroke-linecap="round" stroke-linejoin="round"><path d="M315.0 260 L527.0 356 L315.0 452 L103.0 356 Z" fill="#0F6E56" fill-opacity="0.45"/><path d="M315.0 260 L527.0 356 L315.0 452 L103.0 356 Z" fill="none" stroke="#04342C" stroke-width="11"/><path d="M315.0 294 L461.0 356 L315.0 418 L169.0 356 Z" fill="none" stroke="#fdf6e3" stroke-width="6"/><line x1="315.0" y1="356.0" x2="315.0" y2="168.0" fill="none" stroke="#04342C" stroke-width="9"/><path d="M315.0 176 L419.0 206 L315.0 236 Z" fill="#0F6E56"/></g></g></g>
<rect x="60" y="150" width="630" height="600" rx="24" fill="none" stroke="#0F6E56" stroke-width="3"/>
<text x="60" y="852" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="58" font-weight="700" fill="#002b36">my own spot</text>
<text x="60" y="916" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="29" fill="#586e75">A place that's just mine.</text>
</svg>
