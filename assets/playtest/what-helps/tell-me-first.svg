<!-- The clip lives on an untransformed group: a clip-path resolves in the
     element's own user space, so putting both on one <g> would clip against
     the moved coordinates and shear the top off every picture. -->
<rect id="art" x="60" y="150" width="630" height="600" rx="24" fill="#fdf6e3"/>
<g id="art-illustration" clip-path="url(#art-window)"><g transform="translate(60 178)"><g stroke-linecap="round" stroke-linejoin="round"><rect x="40.0" y="456.0" width="550.0" height="14.0" rx="7.0" fill="#0F6E56" fill-opacity="0.13"/><line x1="40.0" y1="463.0" x2="590.0" y2="463.0" stroke-opacity="0.45" fill="none" stroke="#0F6E56" stroke-width="3"/><rect x="306.0" y="300.0" width="18.0" height="156.0" rx="9.0" fill="#04342C"/><rect x="159.0" y="152.0" width="312.0" height="158.0" rx="20.0" fill="#0F6E56" fill-opacity="0.55"/><rect x="159.0" y="152.0" width="312.0" height="158.0" rx="20.0" fill="none" stroke="#04342C" stroke-width="11"/><rect x="302.0" y="190.0" width="26.0" height="62.0" rx="13.0" fill="#04342C"/><circle cx="315.0" cy="274.0" r="15.0" fill="#04342C"/></g></g></g>
<rect x="60" y="150" width="630" height="600" rx="24" fill="none" stroke="#0F6E56" stroke-width="3"/>
<text x="375" y="726" text-anchor="middle" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="17" fill="#93a1a1" letter-spacing="2">PLACEHOLDER ART · HUMAN ART WANTED</text>
