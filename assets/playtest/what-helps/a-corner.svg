<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<defs><clipPath id="art-window"><rect x="60" y="150" width="630" height="600" rx="24"/></clipPath></defs>
<rect x="0" y="0" width="750" height="1050" rx="48" fill="#eee8d5"/>
<rect x="60" y="60" width="34" height="34" rx="9" fill="#0F6E56"/>
<text x="108" y="87" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="30" font-weight="500" fill="#04342C">what helps</text>
<!-- The clip lives on an untransformed group: a clip-path resolves in the
     element's own user space, so putting both on one <g> would clip against
     the moved coordinates and shear the top off every picture. -->
<rect id="art" x="60" y="150" width="630" height="600" rx="24" fill="#fdf6e3"/>
<g id="art-illustration" clip-path="url(#art-window)"><g transform="translate(60 185)"><g stroke-linecap="round" stroke-linejoin="round"><path d="M150 118 L150 396 L500 396 L500 118" fill="#0F6E56" fill-opacity="0.22"/><path d="M150 400 L500 400 L560 470 L90 470 Z" fill="#0F6E56" fill-opacity="0.12"/><line x1="150.0" y1="118.0" x2="150.0" y2="400.0" fill="none" stroke="#04342C" stroke-width="11"/><line x1="150.0" y1="400.0" x2="500.0" y2="400.0" fill="none" stroke="#04342C" stroke-width="11"/><path d="M184.1 396.0 Q184.1 310.9 216.0 310.9 Q247.9 310.9 247.9 396.0 Z" fill="#04342C" fill-opacity="1.0"/><circle cx="216.0" cy="277.4" r="23.6" fill="#04342C" fill-opacity="1.0"/></g></g></g>
<rect x="60" y="150" width="630" height="600" rx="24" fill="none" stroke="#0F6E56" stroke-width="3"/>
<text x="60" y="852" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="58" font-weight="700" fill="#002b36">a corner</text>
<text x="60" y="916" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="29" fill="#586e75">Somewhere with sides, at my back.</text>
