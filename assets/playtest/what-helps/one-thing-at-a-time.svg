<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<defs><clipPath id="art-window"><rect x="60" y="150" width="630" height="600" rx="24"/></clipPath></defs>
<rect x="0" y="0" width="750" height="1050" rx="48" fill="#eee8d5"/>
<rect x="60" y="60" width="34" height="34" rx="9" fill="#0F6E56"/>
<text x="108" y="87" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="30" font-weight="500" fill="#04342C">what helps</text>
<!-- The clip lives on an untransformed group: a clip-path resolves in the
     element's own user space, so putting both on one <g> would clip against
     the moved coordinates and shear the top off every picture. -->
<rect id="art" x="60" y="150" width="630" height="600" rx="24" fill="#fdf6e3"/>
<g id="art-illustration" clip-path="url(#art-window)"><g transform="translate(60 185)"><g stroke-linecap="round" stroke-linejoin="round"><line x1="150.0" y1="330.0" x2="250.0" y2="330.0" stroke-opacity="0.25" fill="none" stroke="#0F6E56" stroke-width="5"/><line x1="382.0" y1="330.0" x2="482.0" y2="330.0" stroke-opacity="0.25" fill="none" stroke="#0F6E56" stroke-width="5"/><rect x="253.0" y="252.0" width="124.0" height="104.0" rx="16.0" fill="#0F6E56" fill-opacity="0.65"/><rect x="253.0" y="252.0" width="124.0" height="104.0" rx="16.0" fill="none" stroke="#04342C" stroke-width="11"/><rect x="70.0" y="356.0" width="492.0" height="18.0" rx="9.0" fill="#04342C"/><line x1="132.0" y1="374.0" x2="116.0" y2="462.0" fill="none" stroke="#04342C" stroke-width="12"/><line x1="500.0" y1="374.0" x2="516.0" y2="462.0" fill="none" stroke="#04342C" stroke-width="12"/></g></g></g>
<rect x="60" y="150" width="630" height="600" rx="24" fill="none" stroke="#0F6E56" stroke-width="3"/>
<text x="60" y="852" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="58" font-weight="700" fill="#002b36">one thing at a time</text>
<text x="60" y="916" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="29" fill="#586e75">One thing, then the next.</text>
</svg>
