<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<defs><clipPath id="art-window"><rect x="60" y="150" width="630" height="600" rx="24"/></clipPath></defs>
<rect x="0" y="0" width="750" height="1050" rx="48" fill="#eee8d5"/>
<rect x="60" y="60" width="34" height="34" rx="9" fill="#3B6D11"/>
<text x="108" y="87" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="30" font-weight="500" fill="#173404">lily pad</text>
<!-- The clip lives on an untransformed group: a clip-path resolves in the
     element's own user space, so putting both on one <g> would clip against
     the moved coordinates and shear the top off every picture. -->
<rect id="art" x="60" y="150" width="630" height="600" rx="24" fill="#fdf6e3"/>
<g id="art-illustration" clip-path="url(#art-window)"><g transform="translate(60 185)"><g stroke-linecap="round" stroke-linejoin="round"><circle cx="315.0" cy="282.0" r="152.0" stroke-opacity="0.35" fill="none" stroke="#3B6D11" stroke-width="26"/><path d="M163.0 282 a152 152 0 1 1 152 152" fill="none" stroke="#173404" stroke-width="11"/><path d="M315.0 434 q-38 -34 0 -62 q38 28 0 62 Z" fill="#173404"/><polyline points="257.0,282.0 301.0,326.0 383.0,234.0" fill="none" stroke="#173404" stroke-width="11"/></g></g></g>
<rect x="60" y="150" width="630" height="600" rx="24" fill="none" stroke="#3B6D11" stroke-width="3"/>
<text x="60" y="852" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="58" font-weight="700" fill="#002b36">all done</text>
<text x="60" y="916" font-family="'Atkinson Hyperlegible','Atkinson Hyperlegible Next',sans-serif" font-size="29" fill="#586e75">I'm finished here.</text>
</svg>
